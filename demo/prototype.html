<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Island Circuit Prototype</title>
    <style>
      body {
        margin: 16px;
        font:
          14px system-ui,
          sans-serif;
      }
      h1 {
        font-size: 20px;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      input {
        width: 8em;
      }
      #view {
        width: 100%;
        height: 70vh;
        min-height: 260px;
        background: #ddd;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Island Circuit Prototype</h1>
    <form id="controls">
      <label>Seed <input id="seed" value="2401" maxlength="40" /></label>
      <label
        >Layout
        <select id="preset"></select
      ></label>
      <button>Generate</button>
      <button type="button" id="camera">Show 3D terrain</button>
    </form>
    <p id="status" role="status">Loading…</p>
    <div id="view" aria-label="Generated circuit preview"></div>
    <script type="module" src="prototype.js"></script>
  </body>
</html>
