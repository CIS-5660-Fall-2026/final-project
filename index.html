<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neural-Procedural Terrain</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
      .frame-stats {
        position: fixed; left: 8px; top: 8px; padding: 4px 8px; border-radius: 4px;
        color: #fff; background: #0008; font: 13px monospace; pointer-events: none;
      }
      .fatal-error {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
        color: #f88; background: #000c; font: 16px sans-serif; text-align: center;
      }
    </style>
