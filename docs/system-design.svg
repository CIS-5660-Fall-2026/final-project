<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Dungeon generator system design</title>
  <desc id="desc">Parameters feed seeded room growth and loop creation. A validated layout model feeds geometry extraction, a debug view, and JSON export. The SVG renderer combines geometry, visual settings, and optional debug overlays to export the final map.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#faf8f3"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#172a3a">
    <rect x="40" y="30" width="1120" height="90" rx="12" fill="#e9eef3" stroke="#52687d" stroke-width="2"/>
    <text x="600" y="65" font-size="22" font-weight="700">Seed and parameter controls</text>
    <text x="600" y="94" font-size="17">Room count · symmetry · loops · hatch density | Separate layout and drawing random streams</text>

    <rect x="40" y="180" width="340" height="110" rx="12" fill="#ffffff" stroke="#52687d" stroke-width="2"/>
    <text x="210" y="215" font-size="21" font-weight="700">Layout generation</text>
    <text x="210" y="245" font-size="17">Room growth + collision checks</text>
    <text x="210" y="270" font-size="17">Corridors, doors, and extra loops</text>

    <rect x="430" y="180" width="340" height="110" rx="12" fill="#e5efe8" stroke="#52745b" stroke-width="2"/>
    <text x="600" y="215" font-size="21" font-weight="700">Validation + layout model</text>
    <text x="600" y="245" font-size="17">Rooms · graph · walkable grid</text>
    <text x="600" y="270" font-size="17">Connectivity and overlap checks</text>

    <rect x="820" y="180" width="340" height="110" rx="12" fill="#ffffff" stroke="#52687d" stroke-width="2"/>
    <text x="990" y="215" font-size="21" font-weight="700">Geometry extraction</text>
    <text x="990" y="245" font-size="17">Merged walls + door openings</text>
    <text x="990" y="270" font-size="17">Exterior mask for hatching</text>

    <rect x="40" y="380" width="340" height="90" rx="12" fill="#f2eee4" stroke="#867552" stroke-width="2"/>
    <text x="210" y="416" font-size="21" font-weight="700">JSON export</text>
    <text x="210" y="445" font-size="17">Layout, seed, and parameters</text>

    <rect x="430" y="380" width="340" height="90" rx="12" fill="#ffffff" stroke="#52687d" stroke-width="2"/>
    <text x="600" y="416" font-size="21" font-weight="700">Structural view</text>
    <text x="600" y="445" font-size="17">Graph, validation, and route</text>

    <rect x="820" y="380" width="340" height="90" rx="12" fill="#ffffff" stroke="#52687d" stroke-width="2"/>
    <text x="990" y="416" font-size="21" font-weight="700">SVG renderer</text>
    <text x="990" y="445" font-size="17">Ink strokes, grid, and hatching</text>

    <rect x="820" y="530" width="340" height="80" rx="12" fill="#f2eee4" stroke="#867552" stroke-width="2"/>
    <text x="990" y="563" font-size="21" font-weight="700">Final map + SVG export</text>
    <text x="990" y="590" font-size="17">Browser preview and gallery</text>

    <text x="400" y="550" font-size="18" font-weight="700">One shared layout, multiple views</text>
    <text x="400" y="580" font-size="17">Visual edits preserve the generated structure.</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M210 120 V178"/>
    <path d="M380 235 H428"/>
    <path d="M770 235 H818"/>
    <path d="M990 290 V378"/>
    <path d="M600 290 V378"/>
    <path d="M505 290 V330 H210 V378"/>
    <path d="M990 470 V528"/>
    <path d="M770 425 H818" stroke-dasharray="7 5"/>
    <path d="M1130 120 H1180 V425 H1162" stroke-dasharray="7 5"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">
    <text x="997" y="336">geometry</text>
    <text x="610" y="336">validated data</text>
    <text x="1030" y="154">drawing settings</text>
    <text x="776" y="365" text-anchor="middle">optional overlay</text>
  </g>
</svg>
