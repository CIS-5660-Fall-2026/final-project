<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="340" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">B-612 planet generator</title>
  <desc id="desc">Four stages from top to bottom: lay out the landmarks, shape the terrain, populate the surface, then animate and render.</desc>
  <defs>
    <g id="ground">
      <path d="M-23 -2Q-22 -15 -13 -18Q-8 -23 2 -20Q15 -22 20 -11Q26 -2 22 8Q17 19 9 20Q-1 25 -12 19Q-23 14 -23 -2Z" fill="#d9c59d" stroke="#735f4c" stroke-width="1.5"/>
      <path d="M-18 -7Q-7 -14 -1 -12M5 16Q12 13 15 8" fill="none" stroke="#b29c7b" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="-11" cy="7" rx="4.4" ry="2.7" transform="rotate(-19 -11 7)" fill="#b49d7b"/>
      <ellipse cx="9" cy="-4" rx="3" ry="2" transform="rotate(16 9 -4)" fill="#b49d7b"/>
    </g>
    <g id="garden">
      <use xlink:href="#ground"/>
      <path d="M-21 -8Q-16 -18 -6 -19Q0 -22 9 -19Q15 -17 20 -10Q10 -13 5 -10Q0 -7 -8 -10Q-16 -12 -21 -8Z" fill="#829368"/>
      <path d="M4 -19L10 -30L13 -30L19 -15Z" fill="#ad8062" stroke="#725e51" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M-13 -17V-23Q-13 -30 -8 -30Q-3 -30 -3 -23V-17Z" fill="#eff4e6" stroke="#849998" stroke-width="1.1"/>
      <path d="M-8 -18V-24" fill="none" stroke="#5c7857" stroke-width="1.4"/>
      <circle cx="-8" cy="-25" r="2.5" fill="#bd4f45"/>
      <g fill="#fbf5dc"><circle cx="-16" cy="-13" r="1.3"/><circle cx="-4" cy="-13" r="1.2"/><circle cx="0" cy="-14" r="1.2"/><circle cx="4" cy="-12" r="1.2"/></g>
    </g>
    <g id="arrow" fill="none" stroke="#92988a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -7V7M-3.5 3.5L0 7L3.5 3.5"/>
    </g>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="339" rx="12" fill="#fbf9f3" stroke="#d8d8c9"/>
  <g transform="translate(48 45)" fill="none">
    <circle r="22" stroke="#87978b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <ellipse rx="11" ry="22" transform="rotate(28)" stroke="#b7c3b8"/>
    <ellipse rx="22" ry="7" transform="rotate(-15)" stroke="#b7c3b8"/>
    <circle cx="-7" cy="-10" r="3" fill="#bd4f45"/>
    <circle cx="11" cy="-9" r="2.5" fill="#aa7f57"/>
  </g>
  <use xlink:href="#arrow" transform="translate(48 84)"/>
  <use xlink:href="#ground" transform="translate(48 127)"/>
  <use xlink:href="#arrow" transform="translate(48 167)"/>
  <use xlink:href="#garden" transform="translate(48 213)"/>
  <use xlink:href="#arrow" transform="translate(48 250)"/>
  <g transform="translate(48 293)">
    <circle r="30" fill="#243c51"/>
    <use xlink:href="#garden" transform="translate(0 4) scale(.72)"/>
    <path d="M-18 -14v5m-2.5 -2.5h5M19 -9v4m-2 -2h4" stroke="#f0d69a" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" fill="#263949">
    <g font-size="21" font-weight="bold">
      <text x="97" y="42">Lay out the landmarks</text>
      <text x="97" y="124">Shape the terrain</text>
      <text x="97" y="207">Populate the surface</text>
      <text x="97" y="290">Animate and render</text>
    </g>
    <g font-size="15.5" fill="#435250">
      <text x="97" y="65">Reserve one site for the rose and another for the volcano.</text>
      <text x="97" y="147">Use noise to shape the sphere and keep both sites level.</text>
      <text x="97" y="230">Place the props and grow patches of grass and flowers.</text>
      <text x="97" y="313">Add warm light and render one eight-second turn.</text>
    </g>
  </g>
</svg>
